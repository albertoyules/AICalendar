<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efeae1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13100D" media="(prefers-color-scheme: dark)" />

    <!--
      Lo que hace la app instalable en el móvil. En iPhone, Safari usa
      apple-touch-icon para el icono de verdad, no los del manifest — Apple
      tiene su propio mecanismo, más fiable que confiar solo en el estándar.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/iconos/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Calendar" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap"
    />
    <title>IA Calendar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
